# Production-контур платформы «Технозрелость» (тикет 18, масштабируемый).
# Стек: nginx (балансировщик) + frontend (Next.js) + backend (FastAPI, 2 реплики)
#       + PostgreSQL Primary/Replica (pgvector) + MinIO + ClamAV + Redis.
#
# Запуск:   ./deploy.sh            (из infra/; читает .env.production)
# Либо:     docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# Проверка: curl -sk https://localhost/api/v1/health
#           curl -sk https://localhost/api/v1/ready    # readiness: primary+replica
#
# Свойства контура (спека §7.4):
#   - app-слой stateless: backend масштабируется репликами (deploy.replicas: 2),
#     nginx балансирует через Docker DNS (upstream backend:8000).
#   - PostgreSQL: Primary (db) — единственная точка записи; Replica (db-replica) —
#     hot standby для безопасных чтений (реестры). Backend читает реестры через
#     replica при заданной DATABASE_REPLICA_URL / POSTGRES_REPLICA_HOST.
#   - Read-after-write идёт в Primary (сессии записи — только Primary).
#   - Секреты — только через env (.env.production, в .gitignore); повторный
#     запуск идемпотентен (миграции под advisory lock, volumes сохраняются).
#   - Health/readiness у всех сервисов; persistent volumes для данных.

name: technozrelost-prod

services:
  # ── PostgreSQL Primary (запись) ────────────────────────────────────────────
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tz-prod-db-primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Учётка стриминг-репликации (создаётся init-primary.sh, см. infra/postgres/)
      REPL_USER: ${REPL_USER:-replicator}
      REPL_PASSWORD: ${REPL_PASSWORD:-replica_pass}
      REPL_SLOT: ${REPL_SLOT:-tz_replica_slot}
    volumes:
      - pg-prod-primary-data:/var/lib/postgresql/data
      - ./postgres/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/start-primary.sh:/usr/local/bin/start-primary.sh:ro
      - ./postgres/ensure-replication.sh:/usr/local/bin/ensure-replication.sh:ro
    # Точка входа идемпотентна: роль replicator и слот создаются и на пустом,
    # и на существующем томе (аудит-тикет 05).
    entrypoint: ["/bin/bash", "/usr/local/bin/start-primary.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── PostgreSQL Replica (чтение: реестры, каталоги) ────────────────────────
  db-replica:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tz-prod-db-replica
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPRIMARY_HOST: db
      REPL_USER: ${REPL_USER:-replicator}
      REPL_PASSWORD: ${REPL_PASSWORD:-replica_pass}
      REPL_SLOT: ${REPL_SLOT:-tz_replica_slot}
    volumes:
      - pg-prod-replica-data:/var/lib/postgresql/data
      - ./postgres/start-replica.sh:/usr/local/bin/start-replica.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/start-replica.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── MinIO (файлы проектов; тикет 06) ──────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: tz-prod-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ── ClamAV (антивирусная проверка файлов; тикет 06) ───────────────────────
  clamav:
    image: mkodockx/docker-clamav:alpine
    container_name: tz-prod-clamav
    restart: unless-stopped
    volumes:
      - clamav-prod-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 1 localhost 3310 | grep -q PONG || clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Redis (зарезервирован: кэш/очереди/rate limiting; спека §7.4) ─────────
  redis:
    image: redis:7-alpine
    container_name: tz-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend: FastAPI, 2 реплики (stateless, масштабируется) ───────────────
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    # container_name не задаётся: при deploy.replicas имена должны быть уникальны
    # (technozrelost-prod-backend-1/-2); nginx обращается по сервисному имени.
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      APP_ENV: production
      # Primary — запись; Replica — безопасные чтения (реестры)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_REPLICA_HOST: ${POSTGRES_REPLICA_HOST:-db-replica}
      POSTGRES_REPLICA_PORT: ${POSTGRES_REPLICA_PORT:-5432}
      # Альтернатива: полные DSN (приоритетнее POSTGRES_*):
      # DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # DATABASE_REPLICA_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-replica:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-technozrelost}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_ENABLED: "true"
      # Бэкап перед миграциями (тикет 20): 1 = backup.sh до alembic upgrade
      BACKUP_BEFORE_MIGRATIONS: ${BACKUP_BEFORE_MIGRATIONS:-1}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    depends_on:
      db:
        condition: service_healthy
      db-replica:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_started
    volumes:
      # Бэкапы перед миграциями (тикет 20): backup.sh пишет сюда
      - backups-prod-data:/backups
    expose:
      - "8000"
    healthcheck:
      # /api/v1/ready проверяет реальные соединения Primary и Replica
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5).status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Frontend: Next.js (standalone) ─────────────────────────────────────────
  frontend:
    build:
      context: ../../technozrelost-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: tz-prod-frontend
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Server-side вызовы API из NextAuth/SSR (auth.config.ts): внутри сети
      # compose фронтенд должен ходить по имени сервиса, а не на 127.0.0.1.
      API_URL_INTERNAL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Nginx: балансировщик перед backend (реплики) и frontend ───────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tz-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Prometheus: сбор метрик /api/v1/metrics (тикет 20) ────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tz-prod-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    depends_on:
      backend:
        condition: service_started
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Grafana: дашборды поверх Prometheus (тикет 20) ─────────────────────────
  # UI: http://<host>:3001 (логин: GRAFANA_ADMIN_USER / GRAFANA_ADMIN_PASSWORD,
  # по умолчанию admin/admin — сменить в .env.production).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tz-prod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-prod-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/platform.json:ro
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pg-prod-primary-data:
  pg-prod-replica-data:
  minio-prod-data:
  clamav-prod-db:
  redis-prod-data:
  backups-prod-data:
  prometheus-prod-data:
  grafana-prod-data:
