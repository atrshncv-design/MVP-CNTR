# Production-контур платформы «Технозрелость» (P1, одноузловой).
# Стек: nginx + frontend (Next.js) + backend (FastAPI, 1 реплика)
#       + PostgreSQL Primary (pgvector, единственная БД) + MinIO + ClamAV + Redis.
#
# Запуск:   ./deploy.sh            (из infra/; читает .env.production)
# Либо:     docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans
# Проверка: curl -sk https://localhost/api/v1/health
#           curl -sk https://localhost/api/v1/ready    # readiness: primary ok, replica not_configured
#
# Свойства контура (P1: один узел, без SLA, вертикальное расширение):
#   - app-слой stateless: ровно один backend (deploy.replicas: 1);
#     nginx обращается по сервисному имени backend:8000.
#   - PostgreSQL: только Primary (db) — запись и чтение (реестры идут в
#     Primary). Replica нет по проекту; backend не задаёт POSTGRES_REPLICA_HOST.
#   - Роль REPLICATION (REPL_USER/REPL_PASSWORD) сохраняется: она нужна
#     physical pg_basebackup перед миграциями, а не стримингу — слота
#     репликации нет (REPL_SLOT пуст, слот не создаётся).
#   - Секреты — только через env (.env.production, в .gitignore); повторный
#     запуск идемпотентен (миграции под advisory lock, volumes сохраняются).
#   - Health/readiness у всех сервисов; persistent volumes для данных.

name: technozrelost-prod

services:
  # ── PostgreSQL Primary (запись) ────────────────────────────────────────────
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: tz-prod-db-primary
    restart: unless-stopped
    # P1 (таск 04): жёсткий ресурсный конверт — сумма лимитов памяти всех
    # сервисов не выше 8 ГиБ (см. таблицу в README-DEPLOY.md).
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Роль REPLICATION для physical pg_basebackup (backup.sh, таймер).
      # Создаётся init-primary.sh; слота репликации нет (P1: REPL_SLOT пуст).
      REPL_USER: ${REPL_USER:-replicator}
      REPL_PASSWORD: ${REPL_PASSWORD:?REPL_PASSWORD обязателен}
    volumes:
      - pg-prod-primary-data:/var/lib/postgresql/data
      - wal-archive-prod-data:/var/lib/postgresql/wal-archive
      - ./postgres/postgresql-primary.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/postgresql-pitr.conf:/etc/postgresql/postgresql-pitr.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-primary.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/start-primary.sh:/usr/local/bin/start-primary.sh:ro
      - ./postgres/ensure-replication.sh:/usr/local/bin/ensure-replication.sh:ro
      - ./postgres/check-primary-health.sh:/usr/local/bin/check-primary-health.sh:ro
      - ./alerter/postgres-primary-entrypoint.sh:/usr/local/bin/postgres-primary-entrypoint.sh:ro
    # Точка входа идемпотентна: роль replicator создаётся и на пустом,
    # и на существующем томе (аудит-тикет 05). P1: слот репликации не
    # создаётся — REPL_SLOT пуст (см. ensure-replication.sh).
    # start-primary.sh исторически фиксировал только базовый config_file и
    # игнорировал Compose command. Wrapper подключает базовый и PITR-профиль,
    # сохраняя ожидание существующего тома и идемпотентную роль REPLICATION.
    entrypoint: ["/bin/bash", "/usr/local/bin/postgres-primary-entrypoint.sh"]
    healthcheck:
      test: ["CMD", "/bin/bash", "/usr/local/bin/check-primary-health.sh"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tz-app-db

  # ── MinIO (файлы проектов; тикет 06) ──────────────────────────────────────
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    container_name: tz-prod-minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - tz-app-db

  # ── ClamAV (антивирусная проверка файлов; M-04/TICKET-01) ────────────────────
  # M4 TICKET-01 (SPEC-01): mkodockx 1.4.3-r0 absent (85 тегов, max 1.1.2) → официал clamav/clamav:1.4.3
  # digest sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4 (oci index, amd64 only, Hub 2026-08-29)
  clamav:
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    container_name: tz-prod-clamav
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          # P1: ClamAV 1–2 ГиБ (локальный замер 7 МиБ снят с нездорового
          # демона и нерепрезентативен).
          memory: 2G
    volumes:
      - clamav-prod-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 1 localhost 3310 | grep -q PONG || clamdcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - tz-app-db

  # ── Redis (обязательная прод-зависимость, таск 01/R03i: rate-limit + SSE) ──
  # Без здорового Redis backend не стартует (config guard fail-fast) и не
  # проходит readiness (503 -> алерт); depends_on ниже — fail-closed гейт.
  redis:
    image: redis:7-alpine
    container_name: tz-prod-redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # P1 (таск 04): явная политика вытеснения в пределах лимита контейнера
    # (preflight сверяет maxmemory с лимитом выше).
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}", "--maxmemory", "${REDIS_MAXMEMORY:-200mb}", "--maxmemory-policy", "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tz-app-db

  # ── Backend: FastAPI, ровно один (P1: без второй реплики) ────────────────
  backend:
    image: technozrelost-backend:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tz-prod-backend
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          # P1 (таск 04): образ ~682 МБ распакованным + рабочий запас;
          # входит в суммарный потолок 8 ГиБ.
          memory: 1536M
    environment:
      APP_ENV: production
      # P1: единственная БД — Primary (запись и чтение, включая реестры).
      # POSTGRES_REPLICA_HOST/DATABASE_REPLICA_URL не задаются: backend
      # читает реестры через Primary, /ready отдаёт Replica not_configured.
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLM_API_BASE: ${LLM_API_BASE}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-technozrelost}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD обязателен}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_ENABLED: "true"
      BACKUP_FRESHNESS_MARKER: ${BACKUP_FRESHNESS_MARKER:-/backups/.backup-freshness}
      BACKUP_RUN_ID: ${IMAGE_TAG:-local}
      BACKUP_PRE_MIGRATION_MARKER: /backups/.pre-migration-backup
      # Бэкап перед миграциями (тикет 20): 1 = backup.sh до alembic upgrade
      BACKUP_BEFORE_MIGRATIONS: ${BACKUP_BEFORE_MIGRATIONS:-1}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Production marker не может быть успешным без копии MinIO.
      BACKUP_STRICT_MINIO: "1"
      BACKUP_OFFSITE_MARKER: ${BACKUP_OFFSITE_MARKER:-/backups/.offsite-status}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_CONFIG: /rclone-config/rclone.conf
      # Учётные данные роли REPLICATION нужны physical base backup перед миграциями.
      REPL_USER: ${REPL_USER:-replicator}
      REPL_PASSWORD: ${REPL_PASSWORD:?REPL_PASSWORD обязателен}
      BACKUP_LOCK_SCRIPT: /usr/local/bin/tz-backup-lock.py
      RCLONE_GUARD_SCRIPT: /usr/local/bin/tz-check-rclone-crypt.sh
      MC_HOST_URL_SCRIPT: /usr/local/bin/tz-mc-host-url.py
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Бэкапы перед миграциями (тикет 20): backup.sh пишет сюда
      - backups-prod-data:/backups
      - rclone-config-prod:/rclone-config:ro
      # Это только operational scripts, а не app source. Фиксированные host
      # paths сохраняют rollback --no-build совместимым со старым image.
      - ./backend-entrypoint.sh:/usr/local/bin/tz-backend-entrypoint.sh:ro
      - ./backup.sh:/app/backup.sh:ro
      - ./restore.sh:/app/restore.sh:ro
      - ./backup-lock.py:/usr/local/bin/tz-backup-lock.py:ro
      - ./mc-host-url.py:/usr/local/bin/tz-mc-host-url.py:ro
      - ./cron/check-rclone-crypt.sh:/usr/local/bin/tz-check-rclone-crypt.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/tz-backend-entrypoint.sh"]
    expose:
      - "8000"
    healthcheck:
      # /api/v1/ready проверяет реальное соединение Primary
      # (Replica отдаёт not_configured на одноузловом контуре).
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5).status==200 else 1)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tz-app-db
      - tz-monitoring

  # ── Ежедневный backup sidecar (INF-01/04) ───────────────────────────────────
  backup-timer:
    image: technozrelost-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["/bin/sh", "/usr/local/bin/tz-backup-timer.sh"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /usr/local/bin/tz-backup-timer.sh && test -f /usr/local/bin/tz-backup-lock.py && if [ -n \"$${BACKUP_OFFSITE_REMOTE:-}\" ]; then sh /usr/local/bin/tz-check-rclone-crypt.sh; fi"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      TZ: UTC
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_SCRIPT: /app/backup.sh
      BACKUP_LOCK_SCRIPT: /usr/local/bin/tz-backup-lock.py
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_FRESHNESS_MARKER: ${BACKUP_FRESHNESS_MARKER:-/backups/.backup-freshness}
      BACKUP_OFFSITE_MARKER: ${BACKUP_OFFSITE_MARKER:-/backups/.offsite-status}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_CONFIG: /rclone-config/rclone.conf
      RCLONE_GUARD_SCRIPT: /usr/local/bin/tz-check-rclone-crypt.sh
      MC_HOST_URL_SCRIPT: /usr/local/bin/tz-mc-host-url.py
      BACKUP_STRICT_MINIO: "1"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Таймер снимает physical base backup ролью REPLICATION, не app-user.
      REPL_USER: ${REPL_USER:-replicator}
      REPL_PASSWORD: ${REPL_PASSWORD:?REPL_PASSWORD обязателен}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-technozrelost}
    volumes:
      - backups-prod-data:/backups
      - rclone-config-prod:/rclone-config:ro
      - ./backup.sh:/app/backup.sh:ro
      - ./backup-lock.py:/usr/local/bin/tz-backup-lock.py:ro
      - ./mc-host-url.py:/usr/local/bin/tz-mc-host-url.py:ro
      - ./cron/backup-timer.sh:/usr/local/bin/tz-backup-timer.sh:ro
      - ./cron/check-rclone-crypt.sh:/usr/local/bin/tz-check-rclone-crypt.sh:ro
    networks:
      - tz-app-db

  # ── Непрерывная offsite-синхронизация WAL (INF-02/04) ───────────────────────
  wal-offsite:
    image: technozrelost-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.15'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["/bin/sh", "/usr/local/bin/tz-wal-offsite-sync.sh"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /usr/local/bin/tz-wal-offsite-sync.sh && if [ -n \"$${BACKUP_OFFSITE_REMOTE:-}\" ]; then sh /usr/local/bin/tz-check-rclone-crypt.sh; fi"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
    environment:
      WAL_ARCHIVE_DIR: /wal-archive
      BACKUP_DIR: /backups
      WAL_OFFSITE_MARKER: ${WAL_OFFSITE_MARKER:-/backups/.wal-offsite-status}
      WAL_OFFSITE_INTERVAL_SECONDS: ${WAL_OFFSITE_INTERVAL_SECONDS:-60}
      WAL_ARCHIVE_KEEP_DAYS: ${WAL_ARCHIVE_KEEP_DAYS:-7}
      BACKUP_OFFSITE_REMOTE: ${BACKUP_OFFSITE_REMOTE:-}
      RCLONE_CONFIG: /rclone-config/rclone.conf
      CHECK_RCLONE_SCRIPT: /usr/local/bin/tz-check-rclone-crypt.sh
    volumes:
      - wal-archive-prod-data:/wal-archive:rw
      - backups-prod-data:/backups
      - rclone-config-prod:/rclone-config:ro
      - ./cron/wal-offsite-sync.sh:/usr/local/bin/tz-wal-offsite-sync.sh:ro
      - ./cron/check-rclone-crypt.sh:/usr/local/bin/tz-check-rclone-crypt.sh:ro
    networks:
      - tz-app-db

  # ── Алертер: readiness, backup, disk, offsite ─────────────────────────────
  # P1: проверок Replica/слота нет (реплики нет по проекту) — алертер
  # не показывает Replica-предупреждений на одноузловом контуре.
  alerter:
    image: technozrelost-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    command: ["python", "/usr/local/bin/tz-alerter.py"]
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && test -f /usr/local/bin/tz-alerter.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # R06i группа F (таск 16): у алертера нет жёстких depends_on. Он обязан
    # стартовать при лежащих зависимостях и сообщать о них critical-статусом,
    # а не блокироваться в ожидании service_healthy (иначе авария БД/бэкенда
    # гасит и наблюдаемость). Проверки collect_checks fail-closed already.
    environment:
      ALERTER_READINESS_URL: ${ALERTER_READINESS_URL:-http://backend:8000/api/v1/ready}
      ALERTER_MINIO_HEALTH_URL: ${ALERTER_MINIO_HEALTH_URL:-http://minio:9000/minio/health/live}
      ALERTER_CLAMAV_HOST: ${ALERTER_CLAMAV_HOST:-clamav}
      ALERTER_CLAMAV_PORT: ${ALERTER_CLAMAV_PORT:-3310}
      ALERTER_INTERVAL_SECONDS: ${ALERTER_INTERVAL_SECONDS:-60}
      ALERTER_PROBE_TIMEOUT_SECONDS: ${ALERTER_PROBE_TIMEOUT_SECONDS:-5}
      ALERTER_STATE_FILE: /state/alerter-state.json
      ALERTER_DISK_PATHS: /backups,/wal-archive
      ALERTER_DISK_WARN_PERCENT: ${ALERTER_DISK_WARN_PERCENT:-80}
      ALERTER_DISK_CRITICAL_PERCENT: ${ALERTER_DISK_CRITICAL_PERCENT:-90}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_FRESHNESS_MARKER: ${BACKUP_FRESHNESS_MARKER:-/backups/.backup-freshness}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-25}
      BACKUP_OFFSITE_MARKER: ${BACKUP_OFFSITE_MARKER:-/backups/.offsite-status}
      WAL_OFFSITE_MARKER: ${WAL_OFFSITE_MARKER:-/backups/.wal-offsite-status}
      WAL_OFFSITE_MAX_AGE_SECONDS: ${WAL_OFFSITE_MAX_AGE_SECONDS:-300}
      WAL_ARCHIVE_DIR: /wal-archive
      WAL_ARCHIVE_MAX_AGE_SECONDS: ${WAL_ARCHIVE_MAX_AGE_SECONDS:-300}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - backups-prod-data:/backups:ro
      - wal-archive-prod-data:/wal-archive:ro
      - alerter-state-prod-data:/state
      - ./alerter/alerter.py:/usr/local/bin/tz-alerter.py:ro
    networks:
      - tz-app-db
      - tz-monitoring

  # ── Frontend: Next.js (standalone) ─────────────────────────────────────────
  frontend:
    image: technozrelost-frontend:${IMAGE_TAG:-local}
    build:
      context: ../../technozrelost-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8000}
    container_name: tz-prod-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      # Server-side вызовы API из NextAuth/SSR (auth.config.ts): внутри сети
      # compose фронтенд должен ходить по имени сервиса, а не на 127.0.0.1.
      API_URL_INTERNAL: ${API_URL_INTERNAL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tz-edge
      - tz-app-db

  # ── Nginx: вход перед backend и frontend ───────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: tz-prod-nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Таск 07 (G40/G41): webroot для ACME HTTP-01 (tls_renew.sh без
      # остановки nginx). Только challenges, секретов нет.
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tz-edge
      - tz-app-db

  # ── Prometheus: сбор метрик /api/v1/metrics (тикет 20) ────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: tz-prod-prometheus
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
    # P1 (таск 04): ограниченный ретеншн — время и размер (preflight требует оба).
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}"
      - "--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-10GB}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-prod-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tz-app-db
      - tz-monitoring

  # ── Grafana: дашборды поверх Prometheus (тикет 20) ─────────────────────────
  # UI только внутри compose-сети; с хоста использовать SSH-туннель (README).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: tz-prod-grafana
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-prod-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/platform.json:ro
    depends_on:
      prometheus:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tz-monitoring

volumes:
  pg-prod-primary-data:
  wal-archive-prod-data:
  minio-prod-data:
  clamav-prod-db:
  redis-prod-data:
  backups-prod-data:
  rclone-config-prod:
    name: tz-prod-rclone-config
  prometheus-prod-data:
  grafana-prod-data:
  alerter-state-prod-data:

networks:
  # INF-15: раздельные сети — edge (публичный вход), app-db (приложение+БД/хранилища), monitoring (наблюдаемость).
  tz-app-db:
    name: tz-app-db
    ipam:
      config:
        - subnet: 172.30.0.0/24
  tz-edge:
    name: tz-edge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  tz-monitoring:
    name: tz-monitoring
    ipam:
      config:
        - subnet: 172.30.20.0/24
