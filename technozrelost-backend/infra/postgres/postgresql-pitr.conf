# WAL/PITR-профиль Primary (INF-02) — подключается ТОЛЬКО в проде.
#
# Почему отдельный файл, а не общий postgresql-primary.conf: dev-контейнеры
# не имеют тома под архив WAL, а archive_mode=on без доступного каталога
# заставляет PostgreSQL копить сегменты в pg_wal до переполнения диска.
# Прод подключает эти три параметра командой контейнера db (см.
# RUNBOOK-DATA.md, раздел «Подключение в прод-стеке», задача таска 05).
#
# Каталог /var/lib/postgresql/wal-archive обязан лежать НА ОТДЕЛЬНОМ томе
# (wal-archive-prod-data): гибель диска данных не должна уносить архив WAL,
# иначе PITR вырождается в обычный restore из nightly-снапшота.

archive_mode = on

# Идемпотентная атомарная запись сегмента: наличие уже архивированного файла
# считается успехом, иначе PostgreSQL будет бесконечно повторять команду.
# Временный файл не даёт WAL-offsite sidecar-у увидеть частичную копию.
archive_command = 'test -f /var/lib/postgresql/wal-archive/%f || (cp %p /var/lib/postgresql/wal-archive/.%f.tmp && mv /var/lib/postgresql/wal-archive/.%f.tmp /var/lib/postgresql/wal-archive/%f)'

# Принудительная архивация частично заполненного сегмента раз в минуту:
# гарантирует RPO <= 5 мин даже при низкой интенсивности записи
# (без этого сегмент 16 МБ может не закрываться часами).
archive_timeout = 60s
