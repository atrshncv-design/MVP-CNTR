# TYPE  DATABASE        USER            ADDRESS                 METHOD
# Dev-only policy: production монтирует pg_hba.conf и не получает исключение
# для Docker Desktop gateway ниже.
local   replication     replicator                              scram-sha-256
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# Фиксированная сеть dev Compose.
host    replication     replicator      172.31.0.0/24            scram-sha-256
host    all             all             172.31.0.0/24            scram-sha-256

# Linux loopback и Docker Desktop for Mac host gateway. При подключении к
# опубликованному localhost-порту Docker Desktop передаёт PostgreSQL адрес
# gateway из 192.168.65.0/24 (в том числе 192.168.65.1), а не 127.0.0.1.
host    all             all             127.0.0.1/32             scram-sha-256
host    all             all             ::1/128                  scram-sha-256
host    all             all             192.168.65.0/24          scram-sha-256
