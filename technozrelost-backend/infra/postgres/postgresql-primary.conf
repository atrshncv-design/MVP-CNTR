# Primary PostgreSQL config — streaming replication + pgvector-friendly
listen_addresses = '*'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
password_encryption = scram-sha-256

# Лимит удержания WAL физическим слотом репликации (INF-03): при простое
# реплики слот больше не может переполнить диск Primary — старые сегменты
# удаляются, реплика после долгого простоя восстанавливается новым
# basebackup'ом, а не бесконечным доигрыванием.
max_slot_wal_keep_size = 15GB
hot_standby = on
hot_standby_feedback = on

# Connections
max_connections = 100
shared_buffers = 256MB
effective_cache_size = 1GB

# Logging
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '

# pgvector
shared_preload_libraries = ''
