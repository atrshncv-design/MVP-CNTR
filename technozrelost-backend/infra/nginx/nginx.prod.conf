# nginx — балансировщик production-контура (тикет 18 + INF-08/12, N-18).
# Backend масштабируется репликами (deploy.replicas: 2); Docker DNS отдаёт все
# IP сервиса backend. Для динамического резолва без reload используется
# resolver 127.0.0.11 (встроенный DNS Docker, valid 10s) + переменная $backend
# в proxy_pass (иначе резолв кэшируется при старте и рестарт реплик даёт 502).
# Rate limiting: zone auth 10r/s burst 10 (INF-12) и zone registry 100r/s для
# публичных реестров (N-18). Gzip — для текстовых типов, cache _next/static —
# immutable 1 год (INF-12).

# ── Rate limiting zones (http-контекст, файл инклюдится внутри http) ─────────
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=registry:10m rate=100r/s;

# ── Gzip (INF-12) ─────────────────────────────────────────────────────────────
gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
gzip_min_length 1024;
gzip_vary on;
gzip_comp_level 6;
gzip_proxied any;

# HTTP: ACME + healthz, остальное → HTTPS
server {
    listen 80;
    server_name _;

    # Liveness-проба без security-заголовков: у location есть собственный
    # add_header, а наследование add_header в nginx all-or-nothing — со своим
    # add_header location не получает НИ одного серверного. Для :80-server это
    # неважно (security-add_header заданы только в :443-server ниже), проба
    # отвечает голым 'ok' осознанно.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Самоподписанный сертификат по умолчанию; заменить на Let's Encrypt
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    # INF-12: Docker embedded DNS для динамического резолва backend/frontend
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "backend:8000";
    set $frontend "frontend:3000";

    # Источник истины для security-заголовков — nginx: единственная точка
    # входа prod-контура. FastAPI-middleware (app/main.py) и next.config.ts
    # дублируют часть из них для доступа в обход nginx (dev, внутренние
    # клиенты); чтобы на проксируемых ответах не было по два экземпляра
    # (X-Frame-Options SAMEORIGIN+DENY невалиден для браузера),
    # proxy_hide_header ниже вырезает upstream-дубли — клиенту уходит ровно
    # один набор с значениями отсюда. CSP nginx не задаёт и не скрывает —
    # проксируется от фронта как есть.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Синхронизировано с MAX_FILE_SIZE_MB=25 в backend (app/core/config.py):
    # лимит ниже размера файла вернул бы 413 на валидной загрузке.
    client_max_body_size 25m;

    # ── Static Next.js: immutable cache (INF-12) ──────────────────────────────
    location ~* ^/_next/static/ {
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ── Auth endpoints — строгий лимит (INF-12: zone=auth burst=10) ───────────
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ── API реестры + общий API — лимит registry (N-18) ─────────────────────
    # Публичные ILIKE по НИОКТР — дорогие seq scan, защищаем per-IP.
    # 100r/s burst 100 — достаточно для пилота 5К/714 RPS при распределённых IP,
    # при single-IP loadtest остаётся запас; при брутфорсе режется.
    location /api/v1/ {
        limit_req zone=registry burst=100 nodelay;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE-стрим уведомлений (тикет 12) — без буферизации, длинное соединение
    # Вынесен после /api/v1/ но точное совпадение prefix не переопределит:
    # nginx выберет наиболее специфичный префикс, а для SSE отдельный location
    # нужен чтобы отключить buffering. limit_req для SSE не применяем.
    location /api/v1/notifications/stream {
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # NextAuth
    location /api/auth/ {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — фронт (Next.js)
    location / {
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
