# nginx — балансировщик production-контура (тикет 18).
# Backend масштабируется репликами (deploy.replicas: 2); Docker DNS отдаёт все
# IP сервиса backend, upstream балансирует round-robin (nginx 1.27+).

upstream technozrelost_api {
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP: ACME + healthz, остальное → HTTPS
server {
    listen 80;
    server_name _;

    # Liveness-проба без security-заголовков: у location есть собственный
    # add_header, а наследование add_header в nginx all-or-nothing — со своим
    # add_header location не получает НИ одного серверного. Для :80-server это
    # неважно (security-add_header заданы только в :443-server ниже), проба
    # отвечает голым 'ok' осознанно.
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ACME для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    # Самоподписанный сертификат по умолчанию; заменить на Let's Encrypt
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    server_tokens off;

    # Источник истины для security-заголовков — nginx: единственная точка
    # входа prod-контура. FastAPI-middleware (app/main.py) и next.config.ts
    # дублируют часть из них для доступа в обход nginx (dev, внутренние
    # клиенты); чтобы на проксируемых ответах не было по два экземпляра
    # (X-Frame-Options SAMEORIGIN+DENY невалиден для браузера),
    # proxy_hide_header ниже вырезает upstream-дубли — клиенту уходит ровно
    # один набор с значениями отсюда. CSP nginx не задаёт и не скрывает —
    # проксируется от фронта как есть.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Синхронизировано с MAX_FILE_SIZE_MB=25 в backend (app/core/config.py):
    # лимит ниже размера файла вернул бы 413 на валидной загрузке.
    client_max_body_size 25m;

    # API — прокси на upstream backend (реплики FastAPI)
    location /api/v1/ {
        proxy_pass http://technozrelost_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # SSE-стрим уведомлений (тикет 12) — без буферизации, длинное соединение
    location /api/v1/notifications/stream {
        proxy_pass http://technozrelost_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # NextAuth
    location /api/auth/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
