# Nginx — балансировщик перед API-серверами (PRD: «Перед серверами должен стоять балансировщик»).
# Активируется в Фазе 3 (FastAPI-инстансы). Здесь — базовый upstream-шаблон.

upstream technozrelost_api {
    # Инстансы FastAPI (горизонтальное масштабирование уровня логики)
    server api-1:8000 max_fails=3 fail_timeout=30s;
    server api-2:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    location /api/ {
        proxy_pass http://technozrelost_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}