# Prometheus — сбор метрик платформы «Технозрелость» (тикет 20, R06i группа F + T02 per-instance).
# Эндпоинт: GET /api/v1/metrics (Prometheus text exposition, см. app/api/v1/metrics.py).
#
# R06i группа F / T02: скрап backend через DNS-SD.
# P1: backend один, но discovery оставлен вместо static-цели — при возврате
# HA per-instance скрап заработает без смены конфига (instance-метку ставит
# сам Prometheus по цели скрапа). Агрегаты сходятся суммой по инстансам:
# sum(rate(...)) по целям = общий RPS.
# Приложение app-level instance-меток не ставит
# (см. test_two_replicas_scrape_as_separate_instances).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: technozrelost-backend
    metrics_path: /api/v1/metrics
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 8000
        refresh_interval: 30s
