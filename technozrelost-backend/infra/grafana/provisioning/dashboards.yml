# Grafana — provisioning провайдера дашбордов (тикет 20).
# Файл dashboard.json монтируется в /var/lib/grafana/dashboards/platform.json
# (см. docker-compose.prod.yml, сервис grafana).
apiVersion: 1

providers:
  - name: default
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
