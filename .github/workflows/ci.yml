name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: technoz
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: technozrelost
      POSTGRES_REPLICA_HOST: ""
      LLM_API_KEY: ""
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: technoz
          POSTGRES_PASSWORD: change_me
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U technoz -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: technozrelost-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: technozrelost-backend/uv.lock
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Dependency audit
        run: uv run --extra dev --with pip-audit==2.9.0 pip-audit -l
      - name: Ruff
        run: uv run ruff check app tests infra/alerter
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest -q infra/alerter/test_alerter.py tests

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    env:
      API_URL_INTERNAL: http://backend:8000
    defaults:
      run:
        working-directory: technozrelost-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: technozrelost-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
